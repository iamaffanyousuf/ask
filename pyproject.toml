
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ask-cli-ai"
version = "0.1.0"
description = "A unified AI assistant in your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "ASK CLI Contributors" }
]
keywords = ["ai", "cli", "terminal", "openai", "gemini", "groq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

dependencies = [
    "typer",
    "rich",
    "openai",
    "google-genai",
]

[project.scripts]
ask = "ask.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ask"]
